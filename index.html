<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form 49</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">Form 49 <span>First Court · Window 3</span></div>
    <div class="stats">
      <div class="stat"><span class="k">Day</span><span class="v" id="hud-day">1</span></div>
      <div class="stat"><span class="k">Clock</span><span class="v" id="hud-clock">09:00</span></div>
      <div class="stat"><span class="k">Filed</span><span class="v" id="hud-filed">0</span></div>
      <div class="stat"><span class="k">Your merit</span><span class="v" id="hud-merit">-5</span></div>
      <div class="stat"><span class="k">Notes</span><span class="v" id="hud-notes">0B</span></div>
      <button class="sound" id="btn-pause" disabled>Pause</button>
      <button class="sound" id="btn-sound" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <section class="booth" aria-label="Intake window">
    <canvas id="scene" width="200" height="100" aria-label="A ghost waits at the intake counter while Ox-Head stands guard"></canvas>
    <div class="speech" id="speech" title="Tap to finish the line"></div>
    <div class="sr" id="sr-speech" aria-live="polite"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Documents">
    <button class="tab" role="tab" data-tab="file" aria-selected="true">Case file</button>
    <button class="tab" role="tab" data-tab="book" aria-selected="false">The Book</button>
    <button class="tab" role="tab" data-tab="rules" aria-selected="false">Rulebook</button>
  </nav>

  <div class="papers">
    <article class="paper active" id="p-file"></article>
    <article class="paper" id="p-book"></article>
    <article class="paper" id="p-rules"></article>
  </div>

  <footer class="stamps">
    <button class="stamp s-rebirth" id="b-rebirth" disabled>Rebirth<small>to 10th Court</small></button>
    <button class="stamp s-hell" id="b-hell" disabled>Hell<small>pick a court</small></button>
    <button class="stamp s-return" id="b-return" disabled>Return<small>clerical error</small></button>
    <button class="stamp s-bribe" id="b-bribe" hidden>Bribe</button>
  </footer>
</div>

<div id="toast" class="toast" hidden role="status"></div>
<div id="curtain" hidden>
  <div class="night" id="night-wrap" hidden>
    <canvas id="night" width="200" height="100" aria-label="The clerks' dormitory at night. Ghosts snore in bunk beds."></canvas>
    <p id="night-cap"></p>
  </div>
  <div class="card" id="card" hidden><div class="card-day" id="card-day"></div><div class="card-sub" id="card-sub"></div></div>
  <p class="skip">Tap or press any key to skip</p>
</div>
<div id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
